# Everything the site says lives in this file.
# Edit the text between the quotes, save (or "Commit changes" on GitHub), and the site rebuilds in about a minute.
# Long text sits between triple quotes """ like this """ and can span lines.
# Projects show up on the Work page in the order they appear here. The first 6 also show on the Reel page.

[site]
title = "Eric Reier, Video Editor, Los Angeles"
description = """
Eric Reier is a Los Angeles video editor. TV spots, political ads, short films, doc series and corporate video, from ingest to delivery."""
email = "eric.reier@gmail.com"
linkedin = "https://www.linkedin.com/in/eric-reier-781903140/"

[reel]
text = """
I've been cutting for eight years. Right now that's TV spots for Spectrum Reach and political ads for Democratic campaigns. Before that I edited 100+ projects at Privcap for Bain Capital, KKR and Apollo, and did VFX at Bonch Post for Starbucks, Usher and Megan Thee Stallion. I take every job from ingest to delivery, and I watch the final export before anything goes out."""
vimeo_link = "https://vimeo.com/1078098050/d64503b119"
player_url = "https://player.vimeo.com/video/1078098050?h=d64503b119"
still = "img/reel.jpg"

[about]
photo = "img/headshot.jpg"
# One entry per paragraph, in order.
paragraphs = [
  """
I've been cutting in Premiere for eight years. Right now I edit TV commercials for small businesses in 60+ markets on the Spectrum Reach team. I also cut political ads for Democratic candidates across the country, including Tom Perriello, Don Coover and Sara Agerton.""",
  """
Before that I spent almost four years at Privcap. I was hired into quality control and promoted to video editor. I edited 100+ projects there, from 7+ hour annual meeting videos to short corporate pieces, for clients like Bain Capital, KKR and Apollo. When a project got stuck, it usually got handed to me.""",
  """
I got my start as an assistant editor at Bonch Post, on music and commercial projects for Justin Bieber, Usher, Jennifer Lopez, Megan Thee Stallion, Urban Decay and Apple. That's where I picked up After Effects cleanup like screen replacements, light roto and paint-outs.""",
  """
I take projects from ingest to delivery, including media management, the cut, full-res relinks, color prep, versioning and QC. Before anything goes out I watch the whole export and check the levels, the spelling on every graphic, the client notes and the file specs.""",
]
tools = """
Premiere Pro · After Effects · DaVinci Resolve · Avid · Descript · Audition · Photoshop"""
clients = """
Apple, Starbucks, Usher, Justin Bieber, Jennifer Lopez, Megan Thee Stallion, Bain Capital, KKR, Apollo"""
based = "Los Angeles"

[resume]
headline = "Video Editor | Post-Production Specialist"
lede = "Los Angeles, CA · eric.reier@gmail.com"
pdf_link = "https://drive.google.com/file/d/19fJp54G5RpBt_PhjMGl8G2PvkDop5VU4/view"
# Skills: the part before " · " is the label.
