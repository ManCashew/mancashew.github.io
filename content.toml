  "Editing · Premiere Pro, Descript, Avid, Final Cut Pro",
  "Motion & Color · After Effects, DaVinci Resolve, Nuke",
  "Design · Photoshop",
  "Audio · Adobe Audition, Ultimate Vocal Remover",
]
education = [
  "Columbia College Chicago, Bachelor of Arts, Cinema and Television Arts, May 2018",
]

# Jobs, newest first.

[[resume.jobs]]
title = "Content Editor II, Spectrum Reach (via KellyMitchell Group)"
dates = "Jun 2025 - Present"
text = """
Cut and deliver TV commercials for small businesses in 60+ markets on the Spectrum Reach Concierge Services team. Work directly with clients on creative direction and revise spots in real time. Handle motion graphics, audio mixing, and versioning from intake through delivery."""

[[resume.jobs]]
title = "Video Editor, Privcap"
dates = "Sep 2021 - Apr 2025"
text = """
Hired into quality control and promoted to Video Editor. Edited 100+ projects, from 7+ hour annual meeting videos to short corporate pieces, for Bain Capital, KKR, Apollo, and more. Built assembly cuts from Descript transcripts, then finished in Premiere. Built post workflows that scaled, mapping every step and managing proxy sync, archival, and client delivery. Coordinated freelancers and managed versioning to keep projects on schedule."""

[[resume.jobs]]
title = "Assistant Editor, Bonch Post"
dates = "Jan 2020 - Sep 2021"
text = """
Worked on high-volume music and commercial projects for Justin Bieber, Usher, Jennifer Lopez, Megan Thee Stallion, Urban Decay, and Apple. Prepped color sessions, managed full-res relinks, and organized 20+ TB of footage. Did VFX and After Effects cleanup for Starbucks, Usher, and Megan Thee Stallion, including screen replacements, logo replacements, light roto, and paintouts."""

[[resume.jobs]]
title = "Freelance Video Editor"
dates = "2018 - Present"
text = """
Edit political ads for Democratic candidates across the country, including Tom Perriello, Lindsay Gramlich, Don Coover, Sara Agerton, and Bryan Allen. Also handle editing, color, and sound design for online universities, industrial training programs, government agencies, and food brands."""


